expected_outputs:
  - Dictamen ready, not-ready o blocked con evidencia y condiciones.
  - Plan de preparacion, activacion y reversion separado por capa.
  - Result Envelope valido con responsabilidad gc-devops hacia gc-orchestrator.
acceptance_criteria:
  - id: criterion.migrations
    statement: La estrategia de indices, FK NOT VALID y validacion es operativamente reproducible y segura.
  - id: criterion.rollback
    statement: La reversion separa aplicacion, constraints, indices y datos con orden explicito.
  - id: criterion.environment
    statement: El laboratorio PostgreSQL 16 es reproducible o su bloqueo queda demostrado.
  - id: criterion.release
    statement: No ocurre despliegue y se identifican gates obligatorios para una futura activacion.
