x-database-environment: &database-environment
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: "${DOCKER_DB_DATABASE:-territorio}"
  DB_USERNAME: "${DOCKER_DB_USERNAME:-territorio}"
  DB_PASSWORD: "${DOCKER_DB_PASSWORD:-change-me}"

x-app-environment: &app-environment
  <<: *database-environment
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  QUEUE_CONNECTION: redis

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    env_file: "${APP_ENV_FILE:-.env}"
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    depends_on:
      - app
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    env_file: "${APP_ENV_FILE:-.env}"
    environment:
      <<: *app-environment
    command: php artisan queue:work redis --sleep=2 --tries=3 --timeout=120
    depends_on:
      - app
    volumes:
      - app_storage:/var/www/html/storage
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    env_file: "${APP_ENV_FILE:-.env}"
    environment:
      <<: *app-environment
    command: php artisan schedule:work
    depends_on:
      - app
    volumes:
      - app_storage:/var/www/html/storage
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: "${DOCKER_DB_DATABASE:-territorio}"
      POSTGRES_USER: "${DOCKER_DB_USERNAME:-territorio}"
      POSTGRES_PASSWORD: "${DOCKER_DB_PASSWORD:-change-me}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCKER_DB_USERNAME:-territorio} -d ${DOCKER_DB_DATABASE:-territorio}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    env_file: "${APP_ENV_FILE:-.env}"
    environment:
      <<: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - "${RCLONE_CONFIG_PATH:-./docker/backup/rclone.conf}:/root/.config/rclone/rclone.conf:ro"
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    profiles: ["analytics"]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: "${METABASE_DB_DATABASE:-metabase}"
      MB_DB_PORT: 5432
      MB_DB_USER: "${DOCKER_DB_USERNAME:-territorio}"
      MB_DB_PASS: "${DOCKER_DB_PASSWORD:-change-me}"
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${METABASE_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  app_storage:
