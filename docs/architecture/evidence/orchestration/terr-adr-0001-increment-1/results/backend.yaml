summary: >-
  Se implemento la correccion minima del piloto multicampana: contexto autorizado
  tipado, limpieza garantizada, referencias durables en jobs de calendario,
  validaciones previas a adaptadores externos, indices y cinco FK compuestas
  PostgreSQL NOT VALID, ademas de pruebas PHP y una suite PostgreSQL protegida
  para laboratorio desechable.
