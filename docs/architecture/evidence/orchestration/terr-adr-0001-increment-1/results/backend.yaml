effects:
  - El runner acepta unicamente AuthorizedExecutionContext y limpia el store en finally.
  - CurrentCampaign deriva de la misma resolucion autorizada.
  - Los jobs piloto transportan campaign_id y una referencia durable.
  - Las operaciones de calendario fallan cerradas ante discrepancias antes de invocar Google.
  - El outbox inconsistente permanece sin publicar y registra el fallo.
  - Las migraciones incorporan nueve indices y cinco FK compuestas NOT VALID.
  - Organizacion y operacion global son representables, pero ningun resolver las emite.
limitations:
  - El DDL y la semantica de eliminacion no pudieron ejecutarse en PostgreSQL 16.
  - No se ejecuto la suite completa ni la compilacion TypeScript.
  - La migracion de validacion de constraints no se incluyo deliberadamente; requiere un paso y gate posteriores.
  - No se evaluaron relaciones distintas de las tres del piloto.
uncertainty:
  - La compatibilidad ejecutable de ON DELETE SET NULL con lista selectiva debe confirmarse mediante la suite PostgreSQL 16.
  - Debe verificarse pg_index.indisvalid y convalidated en el laboratorio objetivo.
  - La politica de usuarios con varias membresias continua sin resolverse y no fue codificada.
responsibility:
  current: gc-backend
  recipient: gc-orchestrator
