  Revision no destructiva completada sobre las tres relaciones piloto, el contexto
  autorizado y los jobs de calendario. Se confirmaron riesgos de escalamiento por
  rol cruzado, mezcla persistente de asistencia, asociaciones externas cruzadas y
  ejecucion asincrona basada solo en identificadores. Se definieron controles
  minimos, pruebas negativas y criterios de bloqueo sin aceptar riesgos ni ampliar
  el alcance.
