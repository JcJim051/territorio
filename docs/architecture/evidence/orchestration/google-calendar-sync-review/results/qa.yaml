effects:
  - >-
    QA-GCAL-001 — Payloads de jobs anteriores son incompatibles con los
    constructores nuevos. Criterio afectado: criterion.behavior. Riesgo
    provisional: impacto alto y probabilidad media cuando una actualizacion
    conserva trabajos ya encolados. Precondicion: payload serializado antes de
    agregar campaignId. Reproduccion: deserializar payloads sinteticos con las
    propiedades anteriores de SyncGoogleCalendarConnection,
    RenewGoogleCalendarWatch y ApplyCalendarReviewRejection y leer campaignId.
    Esperado: resolver la campana de forma segura o fallar mediante una
    transicion controlada y observable. Observado: los tres producen Error por
    propiedad tipada campaignId no inicializada. Evidencia:
    app/Jobs/SyncGoogleCalendarConnection.php:23,
    app/Jobs/RenewGoogleCalendarWatch.php:20,
    app/Jobs/ApplyCalendarReviewRejection.php:24 y evidence.legacy-payloads.
  - >-
    QA-GCAL-002 — Una campana revocada bloquea el outbox de las campanas
    posteriores. Criterio afectado: criterion.behavior. Riesgo provisional:
    impacto alto y probabilidad alta si el evento pendiente mas antiguo
    requiere reconexion. Precondicion: dos eventos no publicados ordenados por
    id; el primero lanza GoogleCalendarReconnectRequired y el segundo pertenece
    a otra campana sana. Reproduccion: caso revoked_oldest_campaign del
    artefacto QA sintetico. Esperado: el primero conserva su error y el segundo
    se publica independientemente. Observado: return false de Collection.each
    detiene el lote y el segundo queda sin publicar. Evidencia:
    app/Jobs/ProcessCalendarOutbox.php:38, :77 y :86; evidence.qa-probes.
  - >-
    QA-GCAL-003 — Un run activo huerfano permanece para siempre como
    sincronizacion en curso. Criterio afectado: criterion.behavior. Riesgo
    provisional: impacto medio y probabilidad baja a media ante caida entre
    commit y dispatch o terminacion abrupta del worker. Precondicion: run queued
    o running antiguo conserva active_key sin job ejecutable. Reproduccion: caso
    stale_active_run del artefacto QA sintetico. Esperado: vencer el run,
    registrar el fallo y crear una ejecucion nueva. Observado: el dispatcher
    reutiliza indefinidamente el mismo run y no encola trabajo nuevo. Evidencia:
    app/Services/CalendarSyncDispatcher.php:27 y :33; evidence.qa-probes.
  - >-
    QA-GCAL-004 — calendar_sync_runs no garantiza pertenencia comun entre
    campana y conexion. Criterio afectado: criterion.behavior. Riesgo
    provisional: impacto alto para integridad y aislamiento; probabilidad baja
    mediante los caminos actuales y mayor ante futuras escrituras o
    reparaciones. Precondicion: run con campaign_id A y conexion perteneciente a
    B. Reproduccion: caso sync_run_cannot_reference del artefacto QA sintetico.
    Esperado: la base rechaza la fila. Observado: las FKs independientes aceptan
    la relacion cruzada. Evidencia: migracion
    2026_08_03_000300_create_calendar_sync_runs_table.php:14-15 y
    evidence.qa-probes.
  - >-
    QA-GCAL-005 — Archivos del incremento no satisfacen el formato automatizado
    del proyecto. Criterio relacionado: criterion.regression. Riesgo
    provisional: impacto bajo y probabilidad cierta. Esperado: Pint test sin
    diferencias. Observado: seis archivos relevantes requieren formatters.
    Evidencia: evidence.format.
  - El camino nominal de sync run finaliza succeeded, libera active_key y conserva conteos seguros.
  - La excepcion sintetica de reconexion finaliza failed con reconnect_required y libera active_key.
  - La deduplicacion nominal, aislamiento HTTP visible y contexto fail-closed pasan en las pruebas existentes.
