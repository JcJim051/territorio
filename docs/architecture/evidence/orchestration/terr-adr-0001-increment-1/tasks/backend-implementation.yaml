task_schema: "1"
id: territorio.terr-adr-0001.increment-1.backend
correlation_id: territorio-terr-adr-0001-increment-1-20260803
parent_task_id: territorio.terr-adr-0001.increment-1
state: completed
objective: Implementar la correccion minima del piloto multicampana aprobada en TERR-ADR-0001 y en la propuesta consolidada.
scope:
  includes:
    - Contexto autorizado tipado con alcance de campana, store, runner y resolvers controlados.
    - Compatibilidad de CurrentCampaign y endurecimiento de los jobs de calendario del piloto.
    - Indices y cinco FK compuestas PostgreSQL preservando nulabilidad y comportamiento de eliminacion.
    - Pruebas unitarias, funcionales y PostgreSQL sinteticas necesarias para entregar el cambio a QA.
  excludes:
    - RLS, recursos compartidos, otras relaciones y decisiones sobre usuarios multicampana.
    - Produccion, despliegues, datos reales, remediacion de datos y servicios externos.
    - Refactorizaciones o hallazgos no necesarios para el piloto.
capability:
  id: software.backend.defect-correction
  version_constraint: ">=0.1.0 <0.2.0"
assignment:
  position_id: position.backend
  agent_id: gc-backend
governance:
  profile: supervised
  authority_refs:
    - gravity-core.owner
    - TERR-ADR-0001
    - gate.material-action:approved
  approval_gate_refs:
    - gate.material-action
    - gate.release
constraints:
  - No usar datos reales ni modificar bases persistentes del usuario; las pruebas de esquema usan laboratorios sinteticos desechables.
  - No desplegar, promover ni llamar servicios externos.
  - Mantener filtros manuales, FK simples y decisiones de producto pendientes.
  - Usar apply_patch para ediciones y preservar cambios ajenos.
  - Detenerse ante cruces historicos o una ampliacion de alcance.
