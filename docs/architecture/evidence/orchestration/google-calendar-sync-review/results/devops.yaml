effects:
  - "P1: Redis retry_after 90s es menor que worker timeout 120s y lock 110s; desarrollo usa timeout 0."
  - "P1: jobs legados, runs huerfanos y outbox global carecen de ruta segura de drenaje/recuperacion."
  - "P1: README inicia codigo nuevo antes de migrate, permitiendo workers contra esquema viejo."
  - "P2: faltan healthchecks, heartbeats, metricas de lag, locks, outbox y runs."
  - "P2: GOOGLE_CALENDAR_POLL_MINUTES no gobierna el scheduler fijo de dos minutos."
  - "Activacion recomendada: backup/preflight, expand schema, app, workers compatibles, scheduler al final, smoke y observacion."
  - "Rollback recomendado: detener productores, drenar/cuarentenar jobs, revertir app y conservar tabla/historial."
  - No se operaron servicios, colas, configuracion, esquema, datos ni Google.
limitations:
  - Evaluacion estatica; no se midieron locks, duraciones o volumen real.
  - No se conoce el inventario de jobs ni migraciones de otros entornos.
uncertainty:
  - Los tiempos seguros deben fijarse con p95/p99 y latencia real.
  - Se desconoce si Redis/cache es compartido entre replicas objetivo.
