summary: >-
  QA-001 fue corregido mediante una composicion limitada del contexto autorizado:
  un contexto HTTP respaldado por membresia activa puede ejecutar un evento outbox
  durable de la misma campana sin reemplazar ni limpiar prematuramente el contexto
  propietario. Las campanas distintas y las decisiones propietarias incompatibles
  continuan siendo rechazadas.
