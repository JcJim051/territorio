correlation_id: territorio-terr-adr-0001-increment-1-20260803
parent_task_id: territorio.terr-adr-0001.increment-1.backend
state: completed
objective: Corregir exclusivamente QA-001 para que el outbox pueda ejecutarse legitimamente con cola sync bajo el contexto HTTP de la misma campana sin debilitar el rechazo de contextos incompatibles.
scope:
  includes:
    - Composicion segura del contexto ya autorizado de la misma campana durante ProcessCalendarOutbox ejecutado sincronicamente.
    - Conservacion del rechazo de campanas o decisiones incompatibles y limpieza del contexto.
    - Prueba de regresion del flujo de aprobacion que actualmente responde 500 y pruebas negativas relacionadas.
  excludes:
    - Cambios a DDL, migraciones, otras relaciones, colas en general o compatibilidad operativa de jobs historicos.
    - RLS, decisiones pendientes, produccion, despliegues, datos reales y servicios externos.
    - Cualquier otro hallazgo de QA o DevOps.
capability:
  id: software.backend.defect-correction
  version_constraint: ">=0.1.0 <0.2.0"
assignment:
  position_id: position.backend
  agent_id: gc-backend
governance:
  profile: supervised
  authority_refs:
    - gravity-core.owner
    - TERR-ADR-0001
    - gate.material-action:approved
  approval_gate_refs:
    - gate.material-action
    - gate.release
constraints:
  - Corregir solo QA-001 y no ocultar el fallo modificando o eliminando la prueba existente.
  - No permitir anidamiento de otra campana ni convertir coincidencia de ID o source en autoridad.
  - No desplegar, usar datos reales, invocar Google ni modificar bases persistentes.
  - Entregar a QA para revalidacion independiente.
context_refs:
  - id: context.qa-result
    type: test.evidence
