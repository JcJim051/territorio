limitations:
  - El arbol evaluado no tiene commit exclusivo; contiene tambien cambios del piloto multicampana.
  - No se ejecuto PostgreSQL para este incremento; la ausencia de FK compuesta se verifico estructuralmente y con SQLite sintetico.
  - No se realizaron pruebas de navegador; la compilacion demuestra tipado y empaquetado, no comportamiento visual completo.
  - No se midio carga ni concurrencia distribuida real.
  - El warning de chunk grande ya trasciende el incremento y no cambia el resultado.
uncertainty:
  - Se desconoce cuantos trabajos legados existen en otros entornos; no se inspeccionaron colas reales.
  - La probabilidad de runs huerfanos depende de la operacion de workers y del driver de cola.
  - QA no autoriza release ni acepta los riesgos detectados.
