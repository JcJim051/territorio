effects:
  - "BE-GCAL-001 P1: hacer campaignId nullable en jobs legados y resolver solo desde referencia durable; fallar cerrado."
  - "BE-GCAL-002 P1: fan-out y lock outbox por campana; published_at solo para confirmed o terminal_noop."
  - "BE-GCAL-003 P1: ID de evento determinista y adopcion segura ante 409 para cerrar duplicados."
  - "BE-GCAL-004 P1: clasificador central y excepciones sanitizadas sin respuesta externa cruda."
  - "BE-GCAL-005 P2: distinguir auth definitiva, cuota, red, 5xx y errores permanentes."
  - "BE-GCAL-006 P1: FK compuesta campana-conexion, primero NOT VALID en PostgreSQL."
  - "BE-GCAL-007 P2: lease, heartbeat, compare-and-set y recuperador de runs huerfanos."
  - "BE-GCAL-008 P2: estado y enlace derivados de mapping de la conexion activa."
  - "Reversion: aplicacion primero, jobs drenados, restricciones separadas y conservar historial por defecto."
  - No se modificaron archivos, esquema, datos, colas ni servicios externos.
limitations:
