summary: >-
  La suite existente, el camino nominal sintetico, la reconexion sintetica y la
  compilacion pasan. El resultado global es fail porque tres payloads de jobs
  previos no sobreviven el cambio de constructor, un evento outbox antiguo con
  autorizacion revocada detiene deterministicamente eventos posteriores de
  otras campanas, una ejecucion activa huerfana queda indefinidamente en curso
  y la base admite runs con campana y conexion de campanas distintas.
