effects:
  - No se modificaron archivos, codigo, esquema, configuracion ni datos.
  - No se ejecutaron llamadas a Google Calendar ni comprobaciones sobre datos reales.
  - No se aceptaron riesgos, excepciones ni decisiones pendientes de producto.
limitations:
  - El preflight documentado contiene cero filas de asistencia y calendario.
  - No se ejecutaron pruebas porque la instruccion prohibe modificar esquema o datos, incluso temporales.
  - SQLite no puede demostrar la semantica objetivo de PostgreSQL 16.
  - La revision no cubre relaciones distintas de las tres incluidas en el piloto.
uncertainty:
  - Las probabilidades son estimaciones cualitativas basadas en alcanzabilidad, barreras observables y cobertura; no existen metricas de incidentes.
  - La politica para usuarios normales con varias membresias sigue sin resolverse y no fue inferida.
  - El DDL exacto y su comportamiento de eliminacion deben validarse en PostgreSQL 16 antes del gate material.
responsibility:
