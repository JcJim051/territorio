expected_outputs:
  - Cambios de aplicacion y migraciones limitados al piloto aprobado.
  - Pruebas automatizadas y evidencia reproducible con datos sinteticos.
  - Result Envelope valido con archivos cambiados, verificaciones, efectos, limitaciones, incertidumbre y responsabilidad.
acceptance_criteria:
  - id: criterion.context
    statement: El runner solo acepta contexto autorizado, falla cerrado y limpia siempre en finally sin usar source como autoridad.
  - id: criterion.jobs
    statement: Los jobs piloto verifican campaign_id y referencia durable antes de leer, escribir o invocar adaptadores externos.
  - id: criterion.database
    statement: Las cinco relaciones rechazan cruces en PostgreSQL 16 preservando nulabilidad y eliminacion existentes.
  - id: criterion.compatibility
    statement: Varias membresias por usuario siguen representables y las decisiones pendientes no se codifican.
  - id: criterion.scope
    statement: No hay cambios fuera del alcance piloto ni despliegues o datos reales.
classification: internal
