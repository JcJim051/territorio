expected_outputs:
  - Correccion minima de QA-001 y pruebas automatizadas sin cambios de alcance.
  - Result Envelope valido con evidencia y responsabilidad gc-backend hacia gc-orchestrator.
acceptance_criteria:
  - id: criterion.sync-flow
    statement: Aprobar una reunion con cola sync no responde 500 y el outbox conserva su semantica esperada.
  - id: criterion.isolation
    statement: Un contexto de otra campana o incompatible continua siendo rechazado y source no concede autoridad.
  - id: criterion.cleanup
    statement: El contexto permanece correcto durante la composicion legitima y se limpia al terminar la unidad propietaria.
  - id: criterion.regression
    statement: La reproduccion QA-001, pruebas especificas y regresion aplicable pasan sin editar la expectativa para ocultar el defecto.
  - id: criterion.scope
    statement: No se modifican migraciones ni componentes ajenos a QA-001.
classification: internal
