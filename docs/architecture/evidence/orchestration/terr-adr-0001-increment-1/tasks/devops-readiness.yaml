task_schema: "1"
id: territorio.terr-adr-0001.increment-1.devops
correlation_id: territorio-terr-adr-0001-increment-1-20260803
parent_task_id: territorio.terr-adr-0001.increment-1
state: completed
objective: Evaluar independientemente la preparacion operativa y la reversion de la implementacion del piloto multicampana sin desplegarla.
scope:
  includes:
    - Revision de migraciones, transaccionalidad, indices concurrentes, NOT VALID y orden de validacion.
    - Compatibilidad del laboratorio Docker/PostgreSQL 16 y ejecucion reproducible con datos sinteticos.
    - Plan separado de reversion de aplicacion, constraints, indices y datos.
    - Gates y observabilidad necesarios para una futura activacion, sin ejecutarla.
  excludes:
    - Modificar codigo o infraestructura, desplegar, promover o aceptar riesgos.
    - Produccion, datos reales, secretos, backups o servicios externos.
    - Operacion de relaciones fuera del piloto.
capability:
  id: deployment.readiness.assessment
  version_constraint: ">=0.1.0 <0.2.0"
assignment:
  position_id: position.devops
  agent_id: gc-devops
governance:
  profile: supervised
  authority_refs:
    - gravity-core.owner
    - TERR-ADR-0001
    - gate.material-action:approved
  approval_gate_refs:
    - gate.material-action
    - gate.release
constraints:
  - Solo lectura del repositorio y diagnosticos no destructivos.
  - No modificar infraestructura, codigo, esquema o datos persistentes.
  - No desplegar ni promover; el gate.release sigue cerrado.
  - Reportar limitaciones y condiciones de reversibilidad sin aceptar riesgo.
