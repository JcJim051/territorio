summary: >-
  La integridad PostgreSQL 16, el alcance contractual, las garantias directas
  del contexto y la compilacion frontend fueron demostrados. La aceptacion
  falla porque un flujo legitimo HTTP con cola sync intenta ejecutar el outbox
  bajo un contexto ya activo y responde 500; la regresion completa termino con
  58 pruebas aprobadas y 1 fallida.
